<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Experience</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrolling for the full-screen canvas */
            background-color: #000;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* Keep it behind content */
        }
        .overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: 'Fragment Mono', monospace;
            text-align: center;
            pointer-events: none; /* Allow clicks to pass through to canvas if needed, though canvas is behind */
        }
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Fragment Mono', monospace;
            text-decoration: none;
            font-size: 1.2rem;
            z-index: 10;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    <div id="canvas-container"></div>
    <div class="overlay">
        <p>Interactive Mesh Experience</p>
    </div>

    <script type="module" src="interactive.js"></script>
</body>
</html>
